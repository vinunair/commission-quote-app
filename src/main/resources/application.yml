server:
  port: 8080

vendor:
  api-key: local-dev-secret
  # The mock vendor runs inside this app, so follow the app's own port.
  # Replace with the real vendor URL when it's available.
  base-url: http://localhost:${server.port:8080}
  error-rate-percent: 20
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

logging:
  level:
    com.example.commissionquote: INFO

springdoc:
  # Only document the app's own API; the vendor mock is an internal stand-in.
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
