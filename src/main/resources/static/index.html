<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission Quote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Commission Quote</h1>
        <p class="subtitle">Enter loan details to generate a commission quote.</p>

        <form id="quote-form">
            <label for="loanAmount">Loan Amount ($)</label>
            <input type="number" id="loanAmount" name="loanAmount" min="0.01" step="0.01" required>

            <label for="loanTermInMonths">Loan Term (months)</label>
            <input type="number" id="loanTermInMonths" name="loanTermInMonths" min="1" max="480" step="1" required>

            <label for="riskBand">Risk Band</label>
            <select id="riskBand" name="riskBand" required>
                <option value="" disabled selected>Select a risk band</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>

            <button type="submit" id="submit-button">Generate Quote</button>
        </form>

        <div id="status" class="status" hidden></div>

        <section id="result" class="result" hidden>
            <h2>Quote Generated</h2>
            <dl>
                <dt>Quote ID</dt>
                <dd id="result-quoteId"></dd>
                <dt>Commission Rate</dt>
                <dd id="result-commissionRate"></dd>
                <dt>Total Commission</dt>
                <dd id="result-totalCommission"></dd>
            </dl>
        </section>

        <div id="error" class="error" hidden></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
